name: Weekly pulse

# Manual only: Actions → "Weekly pulse" → Run workflow. There is no schedule (runbook.md).
#
# 1. Fetch Play Store reviews and analyse the week (stages 1-8). Needs only GROQ_API_KEY.
# 2. Optionally publish to the Google Doc + a Gmail draft through the MCP server (9-10).
# 3. Export the public snapshot and push it, so the Streamlit dashboard shows the week.
#
# Step 3 runs even if publishing fails (an expired Google login, say), so the dashboard
# still updates; the job is then marked failed so GitHub emails you.
#
# This repository is public, and so are these logs. The pipeline's own output is written
# to a file and only its summary lines are echoed: counts and outcomes, never review text.

on:
  workflow_dispatch:
    inputs:
      week:
        description: "ISO week, e.g. 2026-W42. Empty = last complete week."
        required: false
        default: ""
      publish:
        description: "Publish to the Google Doc and create the Gmail draft"
        type: boolean
        default: false
      republish:
        description: "Publish again even if this week's snapshot says it was already published"
        type: boolean
        default: false

permissions:
  contents: write # to push snapshots/<week>.json

concurrency:
  group: weekly-pulse
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: "1"
  NO_COLOR: "1"
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
  PULSE_MCP_TOKEN: ${{ secrets.PULSE_MCP_TOKEN }}
  PULSE_RECIPIENT: ${{ secrets.PULSE_RECIPIENT }}

jobs:
  pulse:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[scraper]"

      # Labels are cached per review id, so a later run classifies only new reviews.
      - name: Restore the classification cache
        uses: actions/cache@v4
        with:
          path: .cache
          key: classify-${{ github.run_id }}
          restore-keys: classify-

      - name: Resolve the week
        id: week
        env:
          WEEK_INPUT: ${{ inputs.week }}
          PUBLISH: ${{ inputs.publish }}
          REPUBLISH: ${{ inputs.republish }}
        run: |
          week=$(python -c "import os; from pulse.cli import _resolve_week; print(_resolve_week(os.environ['WEEK_INPUT'] or None))")
          echo "week=$week" >> "$GITHUB_OUTPUT"
          # A fresh runner has no runs/ folder, so it can't know what was published. The
          # committed snapshot remembers it instead.
          published=$(python -c "import json,sys,pathlib; p=pathlib.Path('snapshots/$week.json'); print(p.exists() and json.loads(p.read_text())['delivery'].get('doc_status') == 'appended')")
          publish=false
          if [ "$PUBLISH" = "true" ]; then
            if [ "$published" = "True" ] && [ "$REPUBLISH" != "true" ]; then
              echo "::notice::$week is already published (per snapshots/$week.json). Skipping publish; tick 'republish' to force it."
            else
              publish=true
            fi
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "published=$published" >> "$GITHUB_OUTPUT"
          echo "Week $week · publish: $publish"

      - name: Fetch reviews
        run: |
          pulse fetch --week "${{ steps.week.outputs.week }}" > fetch.log 2>&1 && ok=0 || ok=$?
          grep -E "^  (pages|reviews|skipped|date range|stopped)|^Wrote|^Deleted" fetch.log || true
          [ "$ok" = 0 ] || tail -n 5 fetch.log
          exit $ok

      - name: Analyse (stages 1-8)
        run: |
          pulse run --dry-run --week "${{ steps.week.outputs.week }}" > analyse.log 2>&1 && ok=0 || ok=$?
          grep -E "^run |^Run |aborted|^LLM" analyse.log || true
          exit $ok

      - name: Publish to the Doc + Gmail draft (stages 9-10)
        id: publish
        if: steps.week.outputs.publish == 'true'
        continue-on-error: true
        run: |
          run_dir=$(ls -td runs/*/ | head -n 1)
          pulse run --from 9 --run-dir "$run_dir" --week "${{ steps.week.outputs.week }}" $([ "${{ inputs.republish }}" = "true" ] && echo --republish) > publish.log 2>&1 && ok=0 || ok=$?
          grep -E "^Run |aborted|^Document|^Gmail draft|^Partial|invalid_grant|authorization|HTTP [0-9]+" publish.log | sed -E "s#/document/d/[^/ ]+#/document/d/…#; s#r-[0-9A-Za-z-]+#r-…#" || true
          exit $ok

      # An analyse-only run must not overwrite a published week's snapshot: that file is
      # the only record that the week is in the doc.
      - name: Export the snapshot
        if: steps.week.outputs.publish == 'true' || steps.week.outputs.published != 'True'
        run: |
          run_dir=$(ls -td runs/*/ | head -n 1)
          pulse snapshot --run-dir "$run_dir"

      - name: Push the snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add snapshots
          if git diff --cached --quiet; then
            echo "Snapshot unchanged."
          else
            git commit -m "snapshot: ${{ steps.week.outputs.week }} (workflow run ${{ github.run_number }})"
            git push
          fi

      - name: Report a failed publish
        if: steps.publish.outcome == 'failure'
        run: |
          echo "::error::Publishing failed; the dashboard was still updated. If the log mentions invalid_grant, renew the Google login (runbook.md) and run again with publish ticked."
          exit 1
