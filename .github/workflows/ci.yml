name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# The whole suite runs offline: no Anthropic calls, no MCP servers, no network.
# That is a deliberate property (architecture.md §17) — CI must stay green from a clean
# checkout with no servers project present and no API credential configured.
env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Lower bound is the declared requires-python; upper bound catches deprecations early.
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (ruff)
        run: ruff format --check .

      - name: Types (mypy)
        run: mypy src

      - name: Tests (pytest)
        run: pytest -q

      - name: Smoke-test the CLI
        # `doctor` exits 1 when a check fails — expected here, since CI has no Anthropic
        # credential. What matters is that it runs and reports rather than crashing, so
        # the exit code is tolerated while a traceback would still fail the step.
        run: |
          pulse version
          pulse themes
          pulse doctor || true
