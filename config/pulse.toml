# Pipeline tuning. Values here are overridable by environment variables (see config.py)
# and then by CLI flags. Precedence: CLI > env > this file > built-in default.

[window]
# Rolling corpus window (architecture.md D5). The note covers the latest ISO week; the
# trailing weeks form the baseline the week-over-week delta is measured against.
weeks = 12
min_weeks = 8

[input]
# Where the file-drop adapter looks for public review exports (P1).
path = "data/raw"

[draft]
# Validation-gate regeneration budget (architecture.md §9). After this many failed
# attempts the run aborts rather than publishing a non-compliant note.
max_attempts = 3

[play_store]
# What `pulse fetch` downloads. Not used by the pipeline, which only ever reads files
# from [input] path -- see src/pulse/ingest/play_store.py for why fetching is a separate
# command rather than a pipeline source.
app_id = "com.nextbillion.groww"
# `en` keeps the corpus in the language the classifier prompt is written in. It does bias
# the sample: Groww's users review in many Indian languages, and those are excluded.
lang = "en"
country = "in"
# Second ceiling on a fetch, deliberately generous: the *window* is the stop condition,
# and a cap that binds first would hand the pipeline a corpus narrower than
# window.min_weeks, which stage 2 then correctly refuses. Groww gets roughly 100 English
# reviews a day, so 12 weeks is around 8,500 -- this leaves headroom above that.
max_reviews = 15000

[llm]
# Which provider stages 4 (classification) and 6 (drafting) call (architecture.md D6/D6a).
#   groq  — the default; needs GROQ_API_KEY
#   fake  — scripted responses, for offline development and tests
#   none  — refuse every model call, so a misconfiguration fails loudly
provider = "groq"

# Chosen 2026-10-11 by probing the account with `pulse models --probe`. The account offers
# neither Kimi K2 nor Llama 4 (both named by secondary sources as the schema-capable
# models), which is why this is verified rather than assumed.
#
# gpt-oss-120b is the strongest chat model available here and accepts strict json_schema
# once the schema is reshaped for it (see llm.json_schema_for). It is a reasoning model, so
# reasoning_effort below keeps classification from spending its budget deliberating.
# Alternative on this account: qwen/qwen3.8-27b -- strict schema, no reasoning overhead.
model = "openai/gpt-oss-120b"

# Classification is bulk work over short texts; drafting is one quality-sensitive call.
batch_size = 40
classify_max_tokens = 8000
draft_max_tokens = 4000

# Reasoning models (the gpt-oss family) spend output tokens deliberating before they
# answer. Classification is not a reasoning-heavy task, so it runs low; drafting is the
# quality-sensitive step. Silently ignored by models that have no reasoning mode.
classify_reasoning_effort = "low"
draft_reasoning_effort = "medium"

# Deterministic by default: the same corpus should produce the same labels, or the
# per-stage artifacts stop being comparable between runs.
temperature = 0.0

[thresholds]
# Below this many reviews in the target week, the note would be statistically
# meaningless and the run aborts (architecture.md §15).
min_week_reviews = 20
# Classification confidence floor; below this a review is left unclassified rather
# than forced into a theme (architecture.md §8.1).
min_confidence = 0.5

# Inclusive minimum word count for a review to be classified. 9 implements the rule "more
# than 8 words" (decided 2026-10-15). Only tokens containing a letter count, so emoji and
# bare numbers cannot pad a review over the floor.
#
# Measured on the real 12-week corpus, together with the emoji, non-Latin-script and
# romanized-Hindi rules: 1,708 of 8,812 reviews kept (19.4%), at least 86 in every week,
# 144 in the target week -- well above the 20-review floor stage 5 requires.
#
# The trade, recorded rather than hidden: this discards the 4-8 word band, which contains
# genuinely classifiable text ("withdrawal pending since last week" is 5 words). The note
# discloses both counts: these filters are sample selection and the shares are not
# population shares (architecture.md §10).
min_review_words = 9

[docs]
# Heading of each week's section in the standing doc, and the email subject. `{week}` is
# substituted with the ISO week.
title_template = "Groww Review Pulse — {week}"
# The standing Google Doc every week is appended to (implementation-plan.md §8.2). The MCP
# server cannot create or find documents, so create it once by hand in the account the
# server is authorized as. Not a secret; PULSE_DOC_ID overrides it (e.g. for a scratch doc).
document_id = ""
